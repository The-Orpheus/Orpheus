<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orpheus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Orpheus: yo soy tu, y tu eres yo">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>

<!-- Iconos (sprite). Para añadir uno: copia un <symbol> y úsalo con <use href="#i-nombre"/> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></symbol>
  <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></symbol>
</svg>

<div class="app" id="app">

  <!-- ============ BARRA LATERAL ============ -->
  <aside class="side">
    <a class="brand" href="./" aria-label="Orpheus">
      <img class="brand-logo" src="assets/logo.svg" alt="" width="44" height="56">
      <span class="wordmark">Orpheus</span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
  </aside>

  <!-- ============ CONTENIDO ============ -->
  <main class="main">
    <header class="head" id="head">
      <div class="head-top">
        <div class="head-title">
          <h1 id="viewTitle">Biblioteca</h1>
          <p class="sub" id="viewSub"></p>
        </div>
        <div class="head-actions">
          <button class="btn" id="playShuffle" type="button" title="Reproducir un elemento al azar de la biblioteca"><svg class="i"><use href="#i-shuffle"/></svg><span class="lbl">Aleatorio</span></button>
          <button class="btn primary" id="addBtn" type="button" title="Añadir archivos"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">Añadir</span></button>
          <button class="icon-btn" id="headToggle" type="button" aria-label="Ocultar herramientas" aria-expanded="true"><svg class="i"><use href="#i-chev"/></svg></button>
        </div>
      </div>
      <div class="tools" id="tools">
        <button class="btn" id="playAll" type="button"><svg class="i" style="fill:currentColor"><use href="#i-play"/></svg>Reproducir</button>
        <span id="viewActions"></span>
        <span class="spacer"></span>
        <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Buscar" aria-label="Buscar" autocomplete="off"></label>
        <select id="sort" aria-label="Ordenar"></select>
      </div>
    </header>
    <div class="rows" id="rows" role="list"></div>
  </main>

  <!-- ============ BARRA INFERIOR ============ -->
  <footer class="player idle" id="player">
    <div class="now">
      <button class="icon-btn expand-btn" id="expandBtn" type="button" aria-label="Abrir cola de reproducción" aria-expanded="false"><svg class="i"><use href="#i-chev"/></svg></button>
      <div class="np-cover" id="npCover"></div>
      <div class="np-text">
        <div class="np-t" id="npTitle">Nada seleccionado</div>
        <div class="np-a" id="npArtist">Elige algo de la biblioteca</div>
      </div>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Aleatorio" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Anterior"><svg class="i" style="fill:currentColor"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="playBtn" type="button" aria-label="Reproducir"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Siguiente"><svg class="i" style="fill:currentColor"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="repeatBtn" type="button" aria-label="Repetir: desactivado" aria-pressed="false"><svg class="i"><use href="#i-repeat"/></svg><span class="badge" hidden>1</span></button>
      </div>
      <div class="seekrow">
        <span id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Posición">
        <span id="tDur">0:00</span>
      </div>
    </div>
    <div class="vol">
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Silenciar"><svg class="i"><use href="#i-vol"/></svg></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
    </div>
    <section class="queue" id="queue" hidden aria-label="Cola de reproducción">
      <div class="q-head"><b>Cola</b><span id="qInfo"></span></div>
      <div class="q-scroll" id="qScroll"><div class="q-list" id="qList" role="list"></div></div>
    </section>
  </footer>
</div>

<div class="menu" id="menu" hidden role="menu"></div>

<dialog id="dlg">
  <div class="dlg-body">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" hidden></p>
    <input id="dlgInput" type="text" maxlength="60" hidden>
    <div class="dlg-actions">
      <button class="btn ghost" id="dlgCancel" type="button">Cancelar</button>
      <button class="btn primary" id="dlgOk" type="button">Aceptar</button>
    </div>
  </div>
</dialog>

<dialog id="login">
  <form class="dlg-body" id="loginForm">
    <h2>Entrar a Orpheus</h2>
    <p>Usa el correo y la contraseña de tu cuenta. Solo tendrás que hacerlo una vez en cada dispositivo.</p>
    <input id="loginEmail" type="email" name="email" autocomplete="username" placeholder="Correo" required>
    <input id="loginPass" type="password" name="password" autocomplete="current-password" placeholder="Contraseña" required>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <div class="dlg-actions"><button class="btn primary" id="loginOk" type="submit">Entrar</button></div>
  </form>
</dialog>

<dialog id="editDlg">
  <form class="dlg-body" id="editForm">
    <h2>Editar información</h2>
    <label class="fld"><span>Título</span><input id="edTitle" type="text" maxlength="200" required autocomplete="off"></label>
    <label class="fld"><span>Autor</span><input id="edArtist" type="text" maxlength="200" list="dlArtists" autocomplete="off"></label>
    <label class="fld"><span>Álbum</span><input id="edAlbum" type="text" maxlength="200" list="dlAlbums" autocomplete="off"></label>
    <label class="fld"><span>Nº de pista (para ordenar el álbum)</span><input id="edTrack" type="number" min="1" max="999" inputmode="numeric"></label>
    <datalist id="dlArtists"></datalist><datalist id="dlAlbums"></datalist>
    <div class="dlg-actions">
      <button class="btn ghost" id="edCancel" type="button">Cancelar</button>
      <button class="btn primary" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="drop" id="drop" hidden>Suelta los archivos para añadirlos</div>
<input type="file" id="fileInput" accept=".mp3,audio/*" multiple hidden>

<script src="js/app.js?v=5"></script>
</body>
</html>
